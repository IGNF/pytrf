[project]
name = 'pytrf'
version = '0.1'
description = 'Python toolbox for the analysis of time series of terrestrial reference frames'
readme = 'README.md'
authors = [
  { name = 'Paul Rebischung', email = 'paul.rebischung@ign.fr' },
  { name = 'Julien Barneoud', email = 'julien.barneoud@ign.fr' },
  { name = 'Kevin Gobron', email = 'gobron@ipgp.fr' },
  { name = 'Maylis de La Serve', email = 'maylis.teyssendierdelaserve@ign.fr' },
]
dependencies = [
  'pyyaml',
  'numpy',
  'scipy',
  'networkx',
  'astropy',
  'matplotlib',
  'cartopy',
  'unlzw3',
  'pdoc3',
  'geopandas'
]

[project.urls]
homepage = 'https://github.com/prebischung/pytrf'

[build-system]
requires = ['setuptools>=64']
build-backend = 'setuptools.build_meta'
